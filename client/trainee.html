<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trainee Dashboard</title>

    <!-- Optional: CSS for simple styling -->
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }
        section {
            border: 1px solid #ccc;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 8px;
            box-shadow: 1px 1px 5px #ddd;
        }
        input, textarea, button {
            display: block;
            margin: 8px 0;
            padding: 8px;
            width: 100%;
            max-width: 400px;
        }
        button {
            cursor: pointer;
            background-color: #007BFF;
            color: white;
            border: none;
            border-radius: 4px;
        }
        button:hover {
            background-color: #0056b3;
        }
        div {
            margin-top: 8px;
            font-weight: bold;
            color: green;
        }
    </style>
</head>
<body>
    <h1>Welcome to Your Trainee Dashboard</h1>
    <div id="container">
        <!-- JS will inject components here -->
    </div>

    <!-- Axios -->
    <script src="./scripts/axios.min.js"></script>

    <!-- Constants -->
    <script type="module" src="./scripts/constants.js"></script>

    <!-- Components -->
    <script type="module" src="./scripts/component.js"></script>

    <!-- Trainee Dashboard Logic -->
    <script type="module" src="./scripts/trainee.js"></script>
</body>
</html>
